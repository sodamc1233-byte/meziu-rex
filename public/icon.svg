<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#364230" />
      <stop offset="65%" stop-color="#22291f" />
      <stop offset="100%" stop-color="#141912" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#fae28c" />
      <stop offset="50%" stop-color="#e5c158" />
      <stop offset="100%" stop-color="#ae8122" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d778" />
      <stop offset="100%" stop-color="#9e7724" />
    </linearGradient>
    <linearGradient id="rexSkin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#708057" />
      <stop offset="100%" stop-color="#515f3d" />
    </linearGradient>
    <linearGradient id="rexBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa981" />
      <stop offset="100%" stop-color="#76855f" />
    </linearGradient>
  </defs>

  <!-- App Tile Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#rimGrad)" stroke-width="10" stroke-opacity="0.85" />
  <rect x="34" y="34" width="444" height="444" rx="78" fill="none" stroke="#6c785c" stroke-width="3" stroke-opacity="0.45" />

  <!-- Ground shadow under Dino & N -->
  <ellipse cx="268" cy="412" rx="168" ry="24" fill="#0d110c" fill-opacity="0.58" />

  <!-- Layer 1: Rex Mouth Cavity (behind the bitten corner of N) -->
  <path
    d="M178 164 L274 156 L268 232 L182 228 Z"
    fill="#3f2122"
    stroke="#181d16"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Layer 2: Bold Carved Golden 'N' Publisher Emblem (being chomped!) -->
  <g transform="translate(328 266) rotate(-5) translate(-328 -266)">
    <path
      d="M222 396 V132 H276 L372 288 V132 H424 V396 H370 L274 240 V396 Z"
      fill="url(#goldGrad)"
      stroke="#181d16"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <!-- Inner carved highlight bevel on N -->
    <path
      d="M234 384 V144 H268 L378 320 V144 H412"
      fill="none"
      stroke="#fff3c4"
      stroke-opacity="0.45"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Layer 3: Cute Meziu Rex Tail, Body & Legs -->
  <!-- Tail sweeping behind -->
  <path
    d="M126 306 C84 310 56 276 58 232 C66 266 94 276 130 270 Z"
    fill="url(#rexSkin)"
    stroke="#181d16"
    stroke-width="11"
    stroke-linejoin="round"
  />
  <!-- Back leg -->
  <path
    d="M176 346 L176 404 L208 404 C214 404 214 390 202 388 L198 346"
    fill="#4a5637"
    stroke="#181d16"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Chunky Torso flowing cleanly from neck -->
  <path
    d="M116 244 C106 310 118 370 168 376 C214 380 230 330 222 246"
    fill="url(#rexSkin)"
    stroke="#181d16"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Belly patch -->
  <path
    d="M170 268 C198 272 210 318 198 358 C184 366 164 362 156 346 C150 322 154 278 170 268 Z"
    fill="url(#rexBelly)"
  />
  <!-- Front leg flowing seamlessly from hip -->
  <path
    d="M132 342 L132 406 L172 406 C178 406 178 390 164 388 L160 342"
    fill="url(#rexSkin)"
    stroke="#181d16"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 4: Lower Jaw & Bottom Teeth clamping UP onto N -->
  <path
    d="M178 214 C202 222 246 218 272 204 C272 232 244 252 198 250 C174 248 162 232 164 216 Z"
    fill="url(#rexSkin)"
    stroke="#181d16"
    stroke-width="11"
    stroke-linejoin="round"
  />
  <!-- Lower teeth biting N -->
  <polygon points="218,214 227,194 236,213" fill="#f5f3e7" stroke="#181d16" stroke-width="5" stroke-linejoin="round" />
  <polygon points="242,210 252,190 260,207" fill="#f5f3e7" stroke="#181d16" stroke-width="5" stroke-linejoin="round" />

  <!-- Layer 5: Upper Cranium & Snout clamping DOWN over N's corner -->
  <path
    d="M114 236 C100 174 114 106 178 96 C234 88 278 114 282 154 C284 174 268 182 244 182 C214 182 184 184 166 226 C152 248 122 256 114 236 Z"
    fill="url(#rexSkin)"
    stroke="#181d16"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <!-- Upper teeth biting down on N -->
  <polygon points="208,181 217,204 227,181" fill="#f5f3e7" stroke="#181d16" stroke-width="5" stroke-linejoin="round" />
  <polygon points="234,180 244,203 253,179" fill="#f5f3e7" stroke="#181d16" stroke-width="5" stroke-linejoin="round" />
  <polygon points="258,176 268,198 276,174" fill="#f5f3e7" stroke="#181d16" stroke-width="5" stroke-linejoin="round" />

  <!-- Nostril dot -->
  <circle cx="258" cy="134" r="4.5" fill="#2a331f" />

  <!-- Big Expressive Meziu Rex Eyes -->
  <ellipse cx="182" cy="144" rx="22" ry="25" fill="#f5f6ee" stroke="#181d16" stroke-width="8" />
  <circle cx="189" cy="145" r="9" fill="#181d16" />
  <circle cx="192" cy="141" r="3" fill="#ffffff" />

  <ellipse cx="229" cy="133" rx="15" ry="17" fill="#f5f6ee" stroke="#181d16" stroke-width="7" />
  <circle cx="233" cy="134" r="6.5" fill="#181d16" />
  <circle cx="235" cy="131" r="2.2" fill="#ffffff" />

  <!-- Playful Tiny Arm grabbing the N stem -->
  <path
    d="M196 292 C216 292 232 288 242 296 C246 302 242 312 232 312 C220 312 206 310 194 312"
    fill="#708057"
    stroke="#181d16"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Crisp cartoon chomp accent lines -->
  <path d="M292 114 L306 96" stroke="#fde047" stroke-width="7" stroke-linecap="round" />
  <path d="M308 134 L328 124" stroke="#fde047" stroke-width="7" stroke-linecap="round" />
</svg>
